services:
  catalog:
    build: ./catalog-service
    ports:
      - "5001:5001"
    volumes:
      - ./catalog-service:/app
    environment:
      - PYTHONUNBUFFERED=1

  order:
    build: ./order-service
    volumes:
      - ./order-service:/app
    ports:
      - "5002:5002"
    environment:
      - CATALOG_SERVICE_URL=http://catalog:5001
      - PYTHONUNBUFFERED=1
    depends_on:
      - catalog

  frontend:
    build: ./frontend-service
    ports:
      - "5000:5000"
    environment:
      - CATALOG_SERVICE_URL=http://catalog:5001
      - ORDER_SERVICE_URL=http://order:5002
      - PYTHONUNBUFFERED=1
    depends_on:
      - catalog
      - order

